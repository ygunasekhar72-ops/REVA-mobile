name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest android/app/src/main/assets/
          cp -r css js assets android/app/src/main/assets/

      - name: Create signing keystore (first run only, committed for stable signatures)
        run: |
          cd android
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias reva \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass reva-demo-key -keypass reva-demo-key \
              -dname "CN=REVA, OU=REVA, O=REVA, L=Local, ST=Local, C=IN"
            printf 'storeFile=keystore.jks\nstorePassword=reva-demo-key\nkeyAlias=reva\nkeyPassword=reva-demo-key\n' > keystore.properties
            cd ..
            git config user.name "reva-ci"
            git config user.email "actions@github.com"
            git add android/keystore.jks android/keystore.properties
            git commit -m "chore: add generated signing keystore [skip ci]"
            git push
          fi

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: REVA-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          gh release create "v$VERSION" "android/app/build/outputs/apk/release/app-release.apk#REVA-v$VERSION.apk" \
            --title "REVA v$VERSION" \
            --notes "REVA $VERSION — a local-first mobile AI harness.

          **Install:** download REVA-v$VERSION.apk and open it (Android asks to allow installs from this source).

          The app ships fully offline. Add any OpenAI-compatible provider in Settings → Model — the APK talks to APIs directly (no CORS proxy needed), e.g. NVIDIA NIM: \`https://integrate.api.nvidia.com/v1\`." \
            || gh release upload "v$VERSION" "android/app/build/outputs/apk/release/app-release.apk#REVA-v$VERSION.apk" --clobber
