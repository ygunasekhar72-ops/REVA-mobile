name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle busybox (real terminal toolset, ~300 commands)
        run: |
          cd /tmp
          curl -sL -o bb.zip https://github.com/meefik/busybox/releases/download/1.34.1/busybox-v1_34_1.zip
          unzip -o -q bb.zip 'arm/bin/busybox' 'arm64/bin/busybox' 'x86_64/bin/busybox'
          JNIDIR="$GITHUB_WORKSPACE/android/app/src/main/jniLibs"
          mkdir -p "$JNIDIR/arm64-v8a" "$JNIDIR/armeabi-v7a" "$JNIDIR/x86_64"
          for pair in "arm64 arm64-v8a" "arm armeabi-v7a" "x86_64 x86_64"; do
            set -- $pair
            if [ -f "$1/bin/busybox" ]; then
              cp "$1/bin/busybox" "$JNIDIR/$2/libbusybox.so"
              echo "bundled $2"
            fi
          done
          ls -la "$JNIDIR"/*/libbusybox.so

      - name: Bundle proot (Termux build — its seccomp filter is what makes fork work under the app's zygote seccomp policy; the TermFold build returns ENOSYS on fork when spawned by the app)
        run: |
          JNIDIR="$GITHUB_WORKSPACE/android/app/src/main/jniLibs"
          BASE="https://packages.termux.dev/apt/termux-main/pool/main"
          extract_deb() {
            # $1 = deb url, $2 = abi dir — pulls the proot/loader/talloc members
            curl -sL -o /tmp/pkg.deb "$1"
            python3 - "$2" <<'PYEOF'
            import sys, tarfile
            abi = sys.argv[1]
            t = tarfile.open('/tmp/pkg.deb')
            t.extractall('/tmp/pkg', filter='data')
            import glob, shutil, os
            for src in glob.glob('/tmp/pkg/data/data/com.termux/files/usr/bin/proot'):
                shutil.copy(src, f'/tmp/proot.bin')
            for src in glob.glob('/tmp/pkg/data/data/com.termux/files/usr/libexec/proot/loader'):
                shutil.copy(src, f'/tmp/proot-loader.bin')
            for src in glob.glob('/tmp/pkg/data/data/com.termux/files/usr/lib/libtalloc.so.*.*.*'):
                shutil.copy(src, f'/tmp/libtalloc.bin')
            PYEOF
            cp /tmp/proot.bin "$JNIDIR/$2/libproot.so"
            cp /tmp/proot-loader.bin "$JNIDIR/$2/libproot-loader.so"
            cp /tmp/libtalloc.bin "$JNIDIR/$2/libtalloc.so"
          }
          for abi in arm64-v8a x86_64; do
            case $abi in
              arm64-v8a) AARCH=aarch64 ;;
              x86_64)    AARCH=x86_64 ;;
            esac
            mkdir -p "$JNIDIR/$abi"
            PROOT_URL=$BASE/p/proot/proot_5.1.107.101_$AARCH.deb
            TALLOC_URL=$BASE/libt/libtalloc/libtalloc_2.5.0_$AARCH.deb
            extract_deb "$PROOT_URL" "$abi"
            extract_deb "$TALLOC_URL" "$abi"
            # android shm shim still comes from TermFold's bundle
            curl -sL -o "$JNIDIR/$abi/libandroid-shmem.so" "https://raw.githubusercontent.com/Bibarud/TermFold/HEAD/app/src/main/jniLibs/$abi/libandroid-shmem.so"
            ls -la "$JNIDIR/$abi"
          done

      - name: Bundle REVA Linux rootfs (Alpine minirootfs, extracted in-app at first launch)
        run: |
          mkdir -p android/app/src/main/assets/linux
          for abi in aarch64 x86_64; do
            mkdir -p "android/app/src/main/assets/linux/$abi"
            # rootfs.bin (not .tar.gz): aapt2 decompresses/renames *.gz assets,
            # which would break the in-app extraction path
            curl -sL -o "android/app/src/main/assets/linux/$abi/rootfs.bin" \
              "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/$abi/alpine-minirootfs-3.20.3-$abi.tar.gz"
          done

      - name: Bundle web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest android/app/src/main/assets/
          cp -r css js assets plugins android/app/src/main/assets/

      - name: Create signing keystore (first run only, committed for stable signatures)
        run: |
          cd android
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias reva \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass reva-demo-key -keypass reva-demo-key \
              -dname "CN=REVA, OU=REVA, O=REVA, L=Local, ST=Local, C=IN"
            printf 'storeFile=keystore.jks\nstorePassword=reva-demo-key\nkeyAlias=reva\nkeyPassword=reva-demo-key\n' > keystore.properties
            cd ..
            git config user.name "reva-ci"
            git config user.email "actions@github.com"
            git add android/keystore.jks android/keystore.properties
            git commit -m "chore: add generated signing keystore [skip ci]"
            git push
          fi

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Build debug APK (device verification via adb run-as)
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: REVA-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          gh release create "v$VERSION" "android/app/build/outputs/apk/release/app-release.apk#REVA-v$VERSION.apk" \
            --title "REVA v$VERSION" \
            --notes "REVA $VERSION — a local-first mobile AI harness.

          **Install:** download REVA-v$VERSION.apk and open it (Android asks to allow installs from this source).

          The app ships fully offline. Add any OpenAI-compatible provider in Settings → Model — the APK talks to APIs directly (no CORS proxy needed), e.g. NVIDIA NIM: \`https://integrate.api.nvidia.com/v1\`." \
            || gh release upload "v$VERSION" "android/app/build/outputs/apk/release/app-release.apk#REVA-v$VERSION.apk" --clobber
