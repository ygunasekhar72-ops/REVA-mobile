plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))

android {
    namespace 'com.reva.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.reva.app"
        minSdk 26
        // Target 28 (like Termux, distributed outside Play Store): keeps
        // exec-from-app-home allowed, so the terminal can run downloaded
        // static binaries (pkg install). Play Store would require 34+.
        targetSdk 28
        versionCode 15
        versionName "1.2.2"
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    lint {
        // targetSdk 28 is intentional (exec-from-home for the terminal, like
        // Termux) and lint treats it as a Play-store release error; we ship
        // via GitHub Releases, not Play.
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
